<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Voice - AI TTS App</title>
    <style>
        /* Modern CSS Design */
        :root {
            --primary-color: #4facfe;
            --secondary-color: #00f2fe;
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #1e293b;
            font-size: 24px;
        }

        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            outline: none;
            resize: none;
            transition: 0.3s;
            box-sizing: border-box;
            background: #f8fafc;
        }

        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
        }

        .settings {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        select {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            outline: none;
            font-weight: 600;
            background: white;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .play-btn {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .stop-btn {
            background: #fee2e2;
            color: #ef4444;
        }

        .status {
            margin-top: 15px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart Voice AI</h2>
    <p>আপনার টেক্সটকে প্রফেশনাল ভয়েসে রূপান্তর করুন</p>
    
    <textarea id="textInput" placeholder="এখানে আপনার বার্তাটি লিখুন..."></textarea>
    
    <div class="settings">
        <select id="langSelect">
            <option value="bn-BD">🇧🇩 বাংলা (Bangladesh)</option>
            <option value="en-US">🇺🇸 English (US)</option>
            <option value="hi-IN">🇮🇳 हिन्दी (Hindi)</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="stop-btn" onclick="stopVoice()">⏹ থামুন</button>
        <button class="play-btn" onclick="speakVoice()">▶ প্লে করুন</button>
    </div>

    <div class="status" id="statusMsg">সিস্টেম রেডি...</div>
</div>

<script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('textInput');
    const langSelect = document.getElementById('langSelect');
    const statusMsg = document.getElementById('statusMsg');

    function speakVoice() {
        if (!synth) {
            alert("আপনার ব্রাউজারে এই ফিচারটি নেই! দয়া করে Chrome ব্যবহার করুন।");
            return;
        }

        if (textInput.value.trim() !== "") {
            // আগের ভয়েস বন্ধ করা
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(textInput.value);
            utterance.lang = langSelect.value;
            
            // ভয়েস শুরু হওয়ার ইভেন্ট
            utterance.onstart = () => {
                statusMsg.innerText = "ভয়েস চলছে...";
                statusMsg.style.color = "#22c55e";
            };

            // ভয়েস শেষ হওয়ার ইভেন্ট
            utterance.onend = () => {
                statusMsg.innerText = "সম্পন্ন হয়েছে।";
                statusMsg.style.color = "#94a3b8";
            };

            // প্লে করা
            synth.speak(utterance);
        } else {
            alert("কিছু লিখুন!");
        }
    }

    function stopVoice() {
        synth.cancel();
        statusMsg.innerText = "থামানো হয়েছে।";
        statusMsg.style.color = "#ef4444";
    }
</script>

</body>
</html>
